<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2EC4B6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אמיליה">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<title>המשחק של אמיליה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&display=swap">
<style>
/* Layout: one screen at a time. Companion + speech bubble on top, one board in the middle, max 3 huge choices at the bottom. Single bright look by choice. */
:root {
  --bg: #E5F5F1;
  --bg-dot: #CDEBE3;
  --card: #FFFFFF;
  --ink: #203047;
  --soft: #5B6B7F;
  --buddy: #2EC4B6; --buddy-dk: #1A9B8F; --belly: #BFF1EA;
  --sun: #FFC93C; --sun-dk: #DFA400;
  --go: #7BD84B; --go-dk: #52AE25;
  --grape: #A07BFF; --grape-dk: #7650E0;
  --pink: #FF86BA; --pink-dk: #DE5B95;
  --sky: #6CC4FF; --sky-dk: #3B9BDB;
  --shadow: rgba(32, 48, 71, .16);
  --display: "Fredoka", "Varela Round", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Varela Round", "Fredoka", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 2px, transparent 2.2px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  overscroll-behavior: none;
}
#app {
  height: 100%; max-width: 980px; margin: 0 auto; box-sizing: border-box;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { height: 100%; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--grape); outline-offset: 4px; }

/* 3D pressable button */
.press {
  background: var(--c, var(--card)); border-radius: 30px;
  box-shadow: 0 8px 0 var(--cd, #D5E3EA), 0 12px 20px var(--shadow);
  transition: transform .08s, box-shadow .08s, opacity .3s;
}
.press:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--cd, #D5E3EA), 0 4px 8px var(--shadow); }

/* companion */
.buddy { display: block; width: 100%; height: auto; overflow: visible; }
.buddy .m, .buddy .eyes-closed { display: none; }
.buddy[data-mood="happy"] .m-happy, .buddy[data-mood="think"] .m-think, .buddy[data-mood="eat"] .m-eat,
.buddy[data-mood="party"] .m-party, .buddy[data-mood="sleep"] .m-sleep { display: inline; }
.buddy[data-mood="sleep"] .eyes-open { display: none; }
.buddy[data-mood="sleep"] .eyes-closed { display: inline; }
.buddy .lids { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
.buddy .body-g { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 2.6s ease-in-out infinite; }
.buddy[data-mood="party"] .body-g { animation: jump .5s ease-in-out 3; }
.buddy[data-mood="think"] .body-g { animation: tilt 1s ease-in-out 2; }
.buddy[data-mood="eat"] .body-g { animation: chomp .3s ease-in-out 2; }
.zzz { display: none; font-family: var(--display); font-weight: 700; fill: var(--grape-dk); }
.buddy[data-mood="sleep"] .zzz { display: inline; animation: float 2s ease-in-out infinite; }

.bubble {
  position: relative; background: var(--card); border-radius: 26px;
  padding: 14px 20px; font-size: clamp(20px, 4.6vw, 28px); line-height: 1.5;
  box-shadow: 0 6px 0 #D5E3EA; min-height: 1.5em; text-wrap: balance; cursor: pointer;
}
.bubble::before {
  content: ""; position: absolute; top: 50%; right: -14px; transform: translateY(-50%);
  border-style: solid; border-width: 12px 0 12px 16px; border-color: transparent transparent transparent var(--card);
}

/* home */
.home-top { display: flex; justify-content: flex-end; }
.parent-btn { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--soft); padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.6); }
.parent-btn svg { width: 16px; height: 16px; }
.hero { display: flex; align-items: center; justify-content: center; gap: 22px; }
.hero .buddy-box { width: clamp(96px, 24vw, 190px); flex: none; cursor: pointer; }
.hero .bubble { max-width: 420px; flex: 1; min-width: 0; }
.title { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 7vw, 46px); text-align: center; margin: 0; letter-spacing: .5px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 28px; margin-top: auto; margin-bottom: auto; }
.choice {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: clamp(130px, 22vh, 210px); padding: 12px 10px; border-radius: 36px;
  animation: invite 2.4s ease-in-out infinite;
}
.choice:nth-child(2), .choice:nth-child(3) { animation-delay: 1.2s; }
.choice-art { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 10vw, 68px); line-height: 1; color: var(--ink); }
.choice-pic { font-size: clamp(24px, 6vw, 38px); line-height: 1; }
.sum { display: flex; align-items: center; justify-content: center; gap: 10px; }
.sum .item { font-size: clamp(26px, 6.4vw, 48px); }
.sum .frame { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
.plus { font-family: var(--display); font-weight: 700; font-size: clamp(48px, 11vw, 72px); color: var(--grape-dk); }
.box { font-size: clamp(64px, 15vw, 100px); line-height: 1; }
.track { display: flex; gap: 14px; }
.tile {
  width: clamp(72px, 18vw, 110px); height: clamp(72px, 18vw, 110px); border-radius: 24px; display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: clamp(44px, 11vw, 68px); background: #F3F8FA; box-shadow: 0 5px 0 #DCE7EC;
}
.tile.ask { background: #FFF4D1; box-shadow: 0 5px 0 var(--sun); color: var(--sun-dk); }
.opt.claps { font-size: clamp(26px, 6.5vw, 40px); line-height: 1.15; white-space: normal; }
button.big-pic { background: none; cursor: pointer; }
.big-pic.clap { animation: chomp .25s ease-in-out; }
.choice.wide { grid-column: 1 / -1; flex-direction: row; gap: 22px; min-height: clamp(96px, 14vh, 140px); }
.choice.wide .choice-label { color: #fff; font-size: clamp(26px, 6vw, 36px); }

/* letter map */
.map-title { flex: 1; margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 5.4vw, 32px); text-align: center; }
.map-wrap { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 6px 16px; }
.map-grid { position: relative; display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 18px 14px; max-width: 760px; margin: 0 auto; }
.map-path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stone {
  position: relative; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; max-width: 120px; width: 100%; justify-self: center;
  font-family: var(--display); font-weight: 700; font-size: clamp(32px, 8.5vw, 56px); line-height: 1; transition: transform .1s;
}
.stone:active { transform: translateY(4px); }
.stone.learned { background: var(--sc); color: #fff; box-shadow: 0 6px 0 var(--scd); text-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.stone.todo { background: #F4F0FF; color: transparent; -webkit-text-stroke: 2px var(--grape-dk); box-shadow: 0 6px 0 #DDD3F7; }
.stone.next { background: #FFFFFF; color: var(--ink); box-shadow: 0 0 0 6px var(--sun), 0 8px 0 6px var(--sun-dk); animation: nextStone 1.6s ease-in-out infinite; z-index: 1; }
.stone.just { animation: pop .6s cubic-bezier(.3, 1.7, .5, 1); }
.stone-star { position: absolute; top: -8px; left: -8px; width: 34px; }
.stone-star .st { fill: var(--sun); stroke: var(--sun-dk); }
.sticker {
  width: clamp(120px, 30vw, 170px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: var(--sc); color: #fff; font-family: var(--display); font-weight: 700; font-size: clamp(72px, 18vw, 110px);
  box-shadow: 0 8px 0 var(--grape-dk), 0 0 0 8px #fff; animation: pop .6s cubic-bezier(.3, 1.7, .5, 1);
}
.end-btns { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
.end-hub { font-family: var(--display); font-weight: 700; font-size: 60px; color: var(--ink); }

/* letter hub and its tasks */
.hub-letter { flex: 1; text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(56px, 14vw, 84px); line-height: 1; color: var(--ink); text-shadow: 4px 4px 0 var(--pink); }
.hub-tiles { margin-top: 0; }
.hub-tiles .choice { position: relative; }
.hub-tiles .choice-art { font-size: clamp(44px, 11vw, 70px); }
.hub-tiles .choice.wide .choice-label { color: var(--ink); }
.done-check { position: absolute; top: -10px; left: -10px; width: 44px; height: 44px; border-radius: 50%; background: var(--go); box-shadow: 0 3px 0 var(--go-dk); display: grid; place-items: center; animation: pop .5s cubic-bezier(.3, 1.7, .5, 1); }
.done-check svg { width: 26px; height: 26px; }
.shadow-letter { font-family: var(--display); font-weight: 700; font-size: clamp(150px, 38vw, 240px); line-height: 1; color: #3A4660; opacity: .88; filter: blur(.6px); }
.target-chip { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; padding: 6px 22px; border-radius: 999px; background: #FFF4D1; box-shadow: 0 4px 0 var(--sun); }
.bubbles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: min(100%, 380px); }
.bub {
  aspect-ratio: 1; border-radius: 50%; font-family: var(--display); font-weight: 700; font-size: clamp(40px, 10vw, 58px); line-height: 1; color: var(--ink);
  background: radial-gradient(circle at 35% 30%, #FFFFFF 0 14%, var(--bc) 15% 100%); box-shadow: inset 0 -6px 0 rgba(32, 48, 71, .12), 0 5px 0 #DCE7EC;
  animation: floaty 3s ease-in-out infinite; animation-delay: var(--d, 0s);
}
.bub.popped { animation: popOut .35s ease-in forwards; pointer-events: none; }
.bub.wobble { animation: wobble .5s ease-in-out; }
.bub.hint { box-shadow: 0 0 0 8px var(--sun), 0 5px 0 #DCE7EC; }
.opt.thumb { font-size: clamp(54px, 13vw, 80px); }

/* drawing ladder */
.ladder { display: flex; gap: 8px; align-items: center; }
.rung {
  position: relative; width: clamp(46px, 12vw, 72px); height: clamp(46px, 12vw, 72px); border-radius: 50%; display: grid; place-items: center;
  background: #FFFFFF; box-shadow: 0 4px 0 #D5E3EA; font-size: clamp(22px, 5.6vw, 34px); transition: transform .2s;
}
.rung svg { width: 62%; height: 62%; }
.rung.now { transform: scale(1.2); box-shadow: 0 0 0 4px var(--sun), 0 4px 0 #D5E3EA; z-index: 1; }
.rung.later { opacity: .4; }
.rung.wobble { animation: wobble .5s ease-in-out; }
.rung-star { position: absolute; top: -8px; left: -8px; width: 24px; animation: pop .4s cubic-bezier(.3, 1.7, .5, 1); }
.rung-star .st { fill: var(--sun); stroke: var(--sun-dk); }
.tile-dots { display: flex; gap: 6px; }
.tile-dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, .45); }
.tile-dots i.on { background: #FFFFFF; box-shadow: 0 0 0 2px var(--sun); }
.pad.free { background: #FFFDF7; cursor: crosshair; }
.pad.free canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 26px; touch-action: none; }
.options.pair { grid-template-columns: repeat(2, minmax(0, 200px)); justify-content: space-between; }
.opt.sponge { font-size: 46px; min-height: 84px; }
.opt.done-btn { min-height: 96px; animation: invite 1.6s ease-in-out infinite; }
.opt.done-btn svg { width: 56px; height: 56px; }
.compare { display: flex; gap: 6%; justify-content: center; width: 100%; }
.cmp-card { width: 40%; aspect-ratio: 1; border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 5px var(--sun), 0 6px 0 5px var(--sun-dk); display: grid; place-items: center; overflow: hidden; animation: pop .5s cubic-bezier(.3, 1.7, .5, 1); }
.cmp-card img { width: 100%; height: 100%; }
.cmp-letter { font-family: var(--display); font-weight: 700; font-size: clamp(80px, 22vw, 140px); color: var(--ink); }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes popOut { 0% { transform: scale(1); opacity: 1; } 60% { transform: scale(1.35); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; visibility: hidden; } }
.meet { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 6vw, 48px); flex-wrap: wrap; }
.meet-letter { background: none; font-size: clamp(130px, 32vw, 210px); animation: pop .6s cubic-bezier(.3, 1.7, .5, 1); cursor: pointer; }
.opt.go-next { min-height: 96px; }
.opt.go-next svg { width: 60px; height: 60px; }
.order { border: 2px solid #E3EDF2; border-radius: 14px; padding: 10px 12px; gap: 8px; }
.order legend { padding: 0 6px; color: var(--soft); }
.order .check { align-items: flex-start; line-height: 1.4; }
.order .check input { flex: none; margin-top: 2px; }
.reset-btn { align-self: flex-start; color: var(--soft); text-decoration: underline; padding: 4px 0; font-size: 15px; }
@keyframes nextStone { 0%, 100% { transform: scale(1.06); } 50% { transform: scale(1.16); } }

/* writing pad */
.draw-wrap { position: relative; flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }
.pad { position: relative; touch-action: none; border-radius: 26px; background: #FBFDFE; box-shadow: inset 0 0 0 3px #E3EDF2; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 26px; }
.pad .ink { cursor: crosshair; touch-action: none; }
.draw-pic { position: absolute; top: 4px; left: 4px; font-size: clamp(40px, 10vw, 64px); line-height: 1; pointer-events: none; transition: transform .4s cubic-bezier(.3, 1.7, .5, 1); }
.draw-pic.won { transform: scale(1.6) translate(14px, 14px); }
.options.single { grid-template-columns: minmax(0, 300px); justify-content: center; }
.opt.eraser { display: flex; min-height: 88px; align-items: center; justify-content: center; gap: 14px; font-size: clamp(26px, 6vw, 34px); font-weight: 600; }
.opt.eraser svg { width: 48px; height: 48px; }
.eraser.hint { animation: glow 1.1s ease-in-out infinite; }
.choice-label { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 5vw, 30px); }

/* game */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.round-btn { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.round-btn svg { width: 38px; height: 38px; }
.round-btn[disabled] { opacity: .45; }
.progress { display: flex; gap: 2px; justify-content: center; min-width: 0; }
.progress svg { display: block; width: clamp(18px, 4.6vw, 36px); height: auto; }
.progress .st { fill: #FFFFFF; stroke: #C9D7DE; stroke-width: 2; transition: fill .3s; }
.progress .on .st { fill: var(--sun); stroke: var(--sun-dk); }
.progress .on { animation: pop .5s cubic-bezier(.3, 1.7, .5, 1); }
.talk { display: flex; align-items: center; gap: 22px; }
.talk .buddy-box { width: clamp(84px, 18vw, 124px); flex: none; }
.talk .bubble { flex: 1; min-width: 0; }

.board {
  flex: 1; min-height: 0; background: var(--card); border-radius: 34px; box-shadow: 0 6px 0 #D5E3EA;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; overflow: hidden;
}
.frame { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; direction: rtl; }
.item {
  font-size: clamp(36px, 8.5vw, 62px); line-height: 1; width: 1.45em; height: 1.45em;
  display: grid; place-items: center; border-radius: 22px; position: relative;
}
button.item { background: #F3F8FA; box-shadow: 0 5px 0 #DCE7EC; }
button.item:active { transform: translateY(4px); box-shadow: 0 1px 0 #DCE7EC; }
.item.counted::after {
  content: attr(data-k); position: absolute; top: -8px; left: -8px;
  width: 30px; height: 30px; border-radius: 50%; background: var(--grape); color: #fff;
  font: 700 18px/30px var(--display); text-align: center;
}
.goal { display: flex; align-items: center; gap: 18px; }
.goal-num { font-family: var(--display); font-weight: 700; font-size: clamp(64px, 14vw, 96px); line-height: 1; color: var(--ink); text-shadow: 5px 5px 0 var(--sun); }
.dots { display: flex; gap: 8px; flex-wrap: wrap; max-width: 260px; }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 4px solid var(--grape); box-sizing: border-box; transition: background .2s; }
.dot.full { background: var(--grape); }
.big-pic { font-size: clamp(96px, 24vw, 160px); line-height: 1; animation: pop .5s cubic-bezier(.3, 1.7, .5, 1); }
.big-letter { font-family: var(--display); font-weight: 700; font-size: clamp(100px, 24vw, 170px); line-height: 1; color: var(--ink); text-shadow: 6px 6px 0 var(--pink); }

.options { display: grid; gap: 28px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); padding-bottom: 10px; }
.opt {
  min-height: clamp(100px, 18vh, 140px); display: grid; place-items: center; padding: 10px;
  font-family: var(--display); font-weight: 700; font-size: clamp(56px, 13vw, 88px); line-height: 1; color: var(--ink);
}
.opt.pic { font-size: clamp(56px, 13vw, 84px); }
.opt.group { min-height: clamp(140px, 26vh, 220px); }
.opt.group .frame { gap: 6px; }
.opt.group .item { font-size: clamp(26px, 6vw, 42px); }
.opt.used { opacity: .3; pointer-events: none; }
.opt.wobble, .item.wobble { animation: wobble .5s ease-in-out; }
.opt.hint { animation: glow 1.1s ease-in-out infinite; }
.opt.right { animation: pop .5s cubic-bezier(.3, 1.7, .5, 1); outline: 6px solid var(--go); outline-offset: 4px; }

/* end */
.end { align-items: center; justify-content: center; text-align: center; gap: 18px; }
.end .buddy-box { width: clamp(150px, 34vw, 220px); }
.end .bubble::before { display: none; }
.end-stars { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.end-stars svg { width: clamp(32px, 8vw, 48px); animation: pop .5s cubic-bezier(.3, 1.7, .5, 1) backwards; }
.home-big { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; }
.home-big svg { width: 56px; height: 56px; }

/* parents */
.overlay { position: fixed; inset: 0; background: rgba(32, 48, 71, .45); display: grid; place-items: center; z-index: 30; padding: 16px; }
.panel { background: var(--card); border-radius: 26px; padding: 22px; width: min(420px, 100%); box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; font-size: 17px; }
.panel h2 { margin: 0; font-family: var(--display); font-size: 24px; }
.panel p { margin: 0; color: var(--soft); line-height: 1.5; }
.gate-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.gate-keys button { font: 700 30px var(--display); padding: 12px 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input[type="text"] { font: inherit; font-size: 20px; padding: 10px 14px; border-radius: 14px; border: 2px solid #CBD9E0; }
.check { display: flex; align-items: center; gap: 10px; }
.check input { width: 24px; height: 24px; }
.panel .close { align-self: flex-start; padding: 12px 22px; font-family: var(--display); font-weight: 600; font-size: 19px; }

.confetti { position: fixed; pointer-events: none; z-index: 20; width: 12px; height: 12px; border-radius: 3px; }

@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14%) scale(1.04); } }
@keyframes tilt { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-6deg); } 70% { transform: rotate(6deg); } }
@keyframes chomp { 50% { transform: scale(1.08, .92); } }
@keyframes float { 0%, 100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-6px); opacity: 1; } }
@keyframes pop { 0% { transform: scale(.5); } 100% { transform: scale(1); } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
@keyframes glow { 0%, 100% { box-shadow: 0 8px 0 var(--cd), 0 0 0 0 var(--sun); } 50% { box-shadow: 0 8px 0 var(--cd), 0 0 0 12px var(--sun); } }
@keyframes invite { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

@media (max-width: 520px) {
  .choices { gap: 20px; }
  .options { gap: 18px; }

  // Numbers: how many? (quantity -> numeral, with one-to-one counting support)

  /* ---------------- writing: the letter is only lines, and they fill in as she traces ---------------- */
  // Print-letter strokes in a 100x100 box, in writing order and direction (top y=22, base y=78).
  const STROKES = {
    'א': [[[26, 22], [74, 78]], [[72, 22], [71, 40], [63, 61]], [[41, 40], [36, 62], [26, 78]]],
    'ב': [[[24, 22], [64, 22], [71, 29], [71, 78]], [[80, 78], [22, 78]]],
    'ג': [[[42, 22], [53, 24], [58, 34], [62, 78]], [[61, 62], [40, 78]]],
    'ד': [[[22, 22], [80, 22]], [[67, 22], [67, 78]]],
    'ה': [[[24, 22], [68, 22], [74, 28], [74, 78]], [[30, 40], [30, 78]]],
    'ו': [[[44, 22], [54, 22], [54, 78]]],
    'ז': [[[36, 22], [66, 22]], [[51, 22], [51, 78]]],
    'ח': [[[28, 22], [68, 22], [74, 28], [74, 78]], [[28, 22], [28, 78]]],
    'ט': [[[28, 24], [26, 60], [34, 73], [50, 78], [66, 73], [74, 60], [74, 32], [68, 22], [58, 26], [54, 38]]],
    'י': [[[44, 22], [56, 22], [56, 44]]],
    'כ': [[[24, 22], [58, 22], [70, 28], [76, 42], [76, 58], [70, 72], [58, 78], [24, 78]]],
    'ל': [[[28, 4], [28, 34], [68, 34], [74, 40], [72, 56], [54, 78]]],
    'מ': [[[24, 22], [30, 60], [34, 78]], [[26, 26], [44, 22], [66, 22], [74, 30], [74, 78], [54, 78]]],
    'נ': [[[40, 22], [56, 22], [62, 28], [62, 78], [36, 78]]],
    'ס': [[[26, 22], [62, 22], [72, 30], [76, 48], [72, 68], [58, 78], [40, 78], [28, 68], [24, 46], [26, 22]]],
    'ע': [[[72, 22], [66, 56], [52, 72], [24, 78]], [[34, 22], [62, 58]]],
    'פ': [[[24, 22], [58, 22], [70, 28], [76, 42], [76, 58], [70, 72], [58, 78], [24, 78]], [[36, 22], [36, 44], [50, 44]]],
    'צ': [[[26, 22], [64, 68], [60, 78], [22, 78]], [[74, 22], [70, 40], [53, 53]]],
    'ק': [[[24, 22], [68, 22], [74, 28], [74, 62]], [[30, 40], [30, 96]]],
    'ר': [[[24, 22], [60, 22], [70, 28], [72, 38], [72, 78]]],
    'ש': [[[74, 22], [74, 70], [66, 78], [34, 78], [26, 70], [26, 22]], [[50, 22], [50, 78]]],
    'ת': [[[24, 22], [68, 22], [74, 28], [74, 78]], [[36, 22], [36, 78], [26, 78]]]

  const LINE_W = 9;                 // line width, in letter units (letter box is 100)
  const TOL = LINE_W * 1.5;         // how far from the line still counts
  const EMPTY = '#DCD6EA', FILLED = '#2EC4B6', START = '#5BC46B', ARROW = '#FFFFFF';

  function resample(poly) {
    const out = [poly[0]];
    for (let k = 1; k < poly.length; k++) {
      const [x1, y1] = poly[k - 1], [x2, y2] = poly[k], len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(len));
      for (let j = 1; j <= n; j++) out.push([x1 + (x2 - x1) * j / n, y1 + (y2 - y1) * j / n]);
    }
    return out;
  }

  // Builds the tracing pad on the board and calls onDone when every stroke is filled.
  function tracePad(L, opts, onDone) {
    const [, e] = LET[L].w[0];
    $('board').innerHTML = `<div class="draw-wrap"><div class="pad"><canvas class="ink" data-l="${L}" aria-label="כתיבת האות ${LET[L].n}"></canvas></div><span class="draw-pic" aria-hidden="true">${e}</span></div>`;
    const q = S.q;
    requestAnimationFrame(() => { if (S.q === q) setup(); });

    function setup() {
      const wrap = $('board').querySelector('.draw-wrap'), pad = wrap.querySelector('.pad'), cv = pad.querySelector('canvas');
      const s = Math.max(180, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight) - 8));
      pad.style.width = s + 'px'; pad.style.height = s + 'px';
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = s * dpr; cv.height = s * dpr;
      const ctx = cv.getContext('2d');
      // Fit this letter's lines to the pad, so every letter is drawn as big as possible.
      const all = STROKES[L].flat();
      const minX = Math.min(...all.map((p) => p[0])), maxX = Math.max(...all.map((p) => p[0]));
      const minY = Math.min(...all.map((p) => p[1])), maxY = Math.max(...all.map((p) => p[1]));
      const span = Math.max(maxX - minX, maxY - minY) + LINE_W * 2.6;
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, k = s / span;
      ctx.scale(dpr, dpr); ctx.translate(s / 2, s / 2); ctx.scale(k, k); ctx.translate(-cx, -cy); // draw in letter units from here on

      const strokes = STROKES[L].map(resample);

      };

      function advance(p) {
        if (done) return;

        if (allowAny && prog === 0 && !near(p, pts[0]) && near(p, pts[pts.length - 1])) { pts.reverse(); }
        const skip = Math.max(6, Math.round(pts.length * 0.15));
        let best = -1;
        for (let j = prog; j <= Math.min(pts.length - 1, prog + skip); j++) if (near(p, pts[j])) best = j;
        if (best > prog || (best === 0 && prog === 0 && active)) {

            prog = best; movedOn = true; bigDot = false; lastProg = performance.now();
            const now = performance.now();
            if (now - lastTone > 120) { lastTone = now; tone(560 + 520 * (prog / pts.length), 0.07, 0, 0.06); }
          }
          if (prog >= (pts.length - 1) * 0.85) finishStroke();
        }
      }
      function finishStroke() {
        prog = strokes[si].length - 1;
        popSound(); tone(990, 0.12, 0.05, 0.08);
        si++; prog = 0; fails = 0; allowAny = false; ghostUsed = false; lastProg = performance.now();
        if (si >= strokes.length) {
          done = true; cv.style.cursor = 'default';
          wrap.querySelector('.draw-pic').classList.add('won');
          setTimeout(onDone, 350);
        }
      }
      function miss() {
        fails++;
        if (fails === 1) { bigDot = true; say('מַתְחִילִים כָּאן, בַּנְּקֻדָּה הַיְּרֻקָּה!'); mood('think', 1500); }
        else if (fails === 2) { ghostAt = performance.now(); ghostUsed = true; }

      }

        if (!ev.isPrimary || done || S.locked) return;

      });
      cv.addEventListener('pointermove', (ev) => {
        if (!ev.isPrimary || done) return;
        // Mouse fills even while just hovering; it only starts at the green dot, so passing by paints nothing.
        if (!active && ev.pointerType !== 'mouse') return;
        const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [];
        (evs.length ? evs : [ev]).forEach((pe) => advance(toUnits(pe)));
      });
      const up = (ev) => { if (!ev.isPrimary || !active) return; active = false; if (!movedOn && !done) miss(); };
      cv.addEventListener('pointerup', up);
      cv.addEventListener('pointercancel', up);

      const path = (pts, upto) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let j = 1; j <= upto; j++) ctx.lineTo(pts[j][0], pts[j][1]); ctx.stroke(); };
      function starAt(x, y, r) {
        ctx.fillStyle = '#FFC93C'; ctx.strokeStyle = '#DFA400'; ctx.lineWidth = 0.8;
        ctx.beginPath();
        for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.lineWidth = LINE_W;
      }
      function draw(now) {
        if (!cv.isConnected) return;
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore();
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineWidth = LINE_W; ctx.strokeStyle = EMPTY;
        // Step 1: full lines. Step 2: faded lines. Step 3: no lines, only start and end dots.
        if (!opts.dots) {
          ctx.globalAlpha = opts.faint ? 0.35 : 1;
          strokes.forEach((pts) => path(pts, pts.length - 1));
          ctx.globalAlpha = 1;
        } else if (!done) {
          strokes.forEach((pts, j) => {
            if (j < si) return;
            ctx.globalAlpha = j === si ? 1 : 0.35;
            const e = pts[pts.length - 1];
            starAt(e[0], e[1], LINE_W * 0.62);
            if (j > si) { ctx.fillStyle = START; ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], LINE_W * 0.7, 0, Math.PI * 2); ctx.fill(); }
            ctx.globalAlpha = 1;
          });

        ctx.strokeStyle = FILLED;
        if (done) { ctx.shadowColor = '#FFC93C'; ctx.shadowBlur = 6 + 3 * Math.sin(now / 150); }
        strokes.forEach((pts, j) => { if (j < si) path(pts, pts.length - 1); else if (j === si && prog > 0) path(pts, prog); });
        ctx.shadowBlur = 0;
        if (!done) {
          const pts = strokes[si];

            ctx.fillStyle = START; ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], r * 0.35, 0, Math.PI * 2); ctx.fill();
          }

          if (ghostAt && now >= ghostAt) {
            const t = (now - ghostAt) / 1500;

              ctx.globalAlpha = 0.85; ctx.fillText('👆', g[0], g[1] - 1); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }
  }

  function writingLetter() {
    const learned = getLearned();
    return learned.length && Math.random() < 0.7 ? pick(learned) : pickLetter();
  }
  function trace() {
    const L = writingLetter(), [w] = LET[L].w[0];
    S.q = { prompt: `בּוֹאִי נִכְתֹּב אֶת הָאוֹת ${LET[L].n}! מַתְחִילִים בַּנְּקֻדָּה הַיְּרֻקָּה.`, ok: `כָּתַבְתְּ אֶת ${LET[L].n}, כְּמוֹ ${w}!` };

  /* ---------------- letter path: one letter at a time ---------------- */
  const ABC = 'אבגדהוזחטיכלמנסעפצקרשת'.split('');
  // Distinct letters first; confusing pairs never come one after the other.
  const REC = ['מ', 'ל', 'א', 'ש', 'ת', 'ר', 'ב', 'נ', 'ס', 'ד', 'ג', 'י', 'ו', 'ה', 'פ', 'ק', 'ע', 'ט', 'כ', 'צ', 'ח', 'ז'];
  function getLearned() { try { return JSON.parse(localStorage.getItem('amelia.learned') || '[]').filter((c) => LET[c]); } catch (e) { return S.learnedMem || []; } }
  function setLearned(list) { S.learnedMem = list; try { localStorage.setItem('amelia.learned', JSON.stringify(list)); } catch (e) {} }
  function orderList() {
    if (S.order !== 'rec') return ABC;

  }
  const STONE_COLORS = [['--sun', '--sun-dk'], ['--pink', '--pink-dk'], ['--go', '--go-dk'], ['--sky', '--sky-dk'], ['--grape', '--grape-dk']];

  function openMap(justLearned) {

    const learned = getLearned(), next = orderList().find((c) => !learned.includes(c));
    const text = next ? `בַּחֲרִי אוֹת! הָאוֹת הַבָּאָה הִיא ${LET[next].n}.` : 'לָמַדְתְּ אֶת כָּל הָאוֹתִיּוֹת! אֶפְשָׁר לַחֲזֹר עַל כָּל אוֹת.';

  function renderMap(justLearned) {

    grid.style.setProperty('--cols', cols);
    grid.innerHTML = '<svg class="map-path" aria-hidden="true"></svg>' + list.map((c, i) => {

  }

  function startLesson(L) {

  function meet() {

  function lessonTrace(first) {

    S.q = {
      prompt: first ? `עַכְשָׁו נִכְתֹּב אֶת ${n}. מַתְחִילִים בַּנְּקֻדָּה הַיְּרֻקָּה וְהוֹלְכִים עִם הַחִצִּים.` : 'עוֹד פַּעַם! הַפַּעַם בְּלִי חִצִּים.',

  const picL = () => feedWordFor(S.lesson);

  /* ---------------- letter hub: she picks what to do with each letter ---------------- */
  const TASKS = [
    { id: 'draw', icon: '✏️', label: 'מְצַיְּרִים', say: 'לְצַיֵּר', c: ['--grape', '--grape-dk'], plan: ['step1', 'step2', 'step3', 'step4'], done: (n) => `צִיַּרְתְּ אֶת ${n} לְבַד!` },

    { id: 'pics', icon: '🖼️', label: 'תְּמוּנוֹת', say: 'תְּמוּנוֹת', c: ['--pink', '--pink-dk'], plan: ['picL', 'picL', 'picL'], done: (n) => `מָצָאת תְּמוּנוֹת שֶׁל ${n}!` }
  ];
  const CHECK = '<span class="done-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  function getTasks() { try { return JSON.parse(localStorage.getItem('amelia.tasks') || '{}'); } catch (e) { return S.tasksMem || {}; } }
  function taskDone(L, id) {

  function openHub(L) {
    S.run++; S.game = null; S.lesson = L;
    show('hub'); mood('happy');
    const n = LET[L].n, done = getTasks()[L] || [];
    $('hubLetter').textContent = L;
    $('hubTiles').innerHTML = TASKS.map((t) => `<button type="button" class="choice press" data-task="${t.id}" style="--c: var(${t.c[0]}); --cd: var(${t.c[1]})" aria-label="${t.label}">

      `<button type="button" class="choice press wide" data-task="all" style="--c: var(--sun); --cd: var(--sun-dk)" aria-label="שיעור שלם">
        ${getLearned().includes(L) ? CHECK : ''}<span class="choice-art" aria-hidden="true">⭐</span><span class="choice-label">שִׁעוּר שָׁלֵם</span></button>`;
    $('hubTiles').querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => {
      const id = b.dataset.task;

    }));

  function startTask(L, task) {

  /* ---------------- drawing ladder: from full help to drawing alone ---------------- */
  const LADDER_ICONS = [
    '<span aria-hidden="true">👆</span>',
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18C9 6 15 6 19 18" fill="none" stroke="#B9AEDD" stroke-width="3.4" stroke-linecap="round" opacity=".55"/></svg>',
    '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="3.4" fill="#7BD84B"/><circle cx="10" cy="12" r="1" fill="#9AA6B8"/><circle cx="14" cy="12" r="1" fill="#9AA6B8"/><path d="M19 8.2l1.1 2.3 2.5.3-1.8 1.7.5 2.5-2.3-1.2-2.3 1.2.5-2.5-1.8-1.7 2.5-.3z" fill="#FFC93C"/></svg>',
    '<span aria-hidden="true">🖍️</span>'

  const LADDER_NAMES = ['עִם עֶזְרָה', 'קַוִּים חִוְּרִים', 'רַק נְקֻדּוֹת', 'לְבַד'];
  function getLadder() { try { return JSON.parse(localStorage.getItem('amelia.ladder') || '{}'); } catch (e) { return S.ladderMem || {}; } }
  function saveLadder(L, step) {
    const all = getLadder(); all[L] = Math.max(all[L] || 0, step);
    S.ladderMem = all; try { localStorage.setItem('amelia.ladder', JSON.stringify(all)); } catch (e) {}
  }
  const isLadder = () => S.game === 'task' && S.task && S.task.id === 'draw';
  function renderLadder() {
    const reached = getLadder()[S.lesson] || 0;
    $('progress').innerHTML = '<div class="ladder">' + LADDER_ICONS.map((ic, k) => {
      const state = k === S.i ? 'now' : k < S.i || k < reached ? 'done' : 'later';
      return `<button type="button" class="rung ${state}" data-k="${k}" aria-label="שלב ${k + 1}: ${LADDER_NAMES[k]}">${ic}${state === 'done' ? `<span class="rung-star">${STAR}</span>` : ''}</button>`;
    }).join('') + '</div>';
    $('progress').querySelectorAll('.rung-star .st').forEach((st) => { st.setAttribute('fill', '#FFC93C'); st.setAttribute('stroke', '#DFA400'); st.classList.remove('st'); });
    $('progress').querySelectorAll('.rung').forEach((b) => b.addEventListener('click', () => {
      const k = +b.dataset.k;
      if (k === S.i || S.locked) return;

      S.i = k; S.freeFails = 0; renderProgress(); ask();
    }));
  }
  function ladderStep(k) {
    const L = S.lesson, n = LET[L].n, [w] = LET[L].w[0];
    const resume = S.resumeNote ? 'נַמְשִׁיךְ מִכָּאן! ' : ''; S.resumeNote = false;
    const prompts = [
      `${resume}נִכְתֹּב אֶת ${n} עִם עֶזְרָה. מַתְחִילִים בַּנְּקֻדָּה הַיְּרֻקָּה וְהוֹלְכִים עִם הַחִצִּים.`,
      `${resume}עַכְשָׁו הַקַּוִּים חִוְּרִים. כִּתְבִי אֶת ${n} עֲלֵיהֶם.`,
      `${resume}עַכְשָׁו רַק נְקֻדּוֹת! מִתְחִילִים בַּנְּקֻדָּה הַיְּרֻקָּה וּמַגִּיעִים לַכּוֹכָב.`
    ];
    S.q = { prompt: prompts[k], ok: [`כָּתַבְתְּ ${n}! ${n} כְּמוֹ ${w}.`, 'יָפֶה! כִּמְעַט בְּלִי עֶזְרָה.', 'מְחַבַּרְתְּ אֶת כָּל הַנְּקֻדּוֹת!'][k] };
    const first = k === 0 && !(getLadder()[L] > 0);
    tracePad(L, [{ arrows: true, demo: first }, { faint: true }, { dots: true }][k], () => { saveLadder(L, k + 1); success(null); });
  }
  const step1 = () => ladderStep(0), step2 = () => ladderStep(1), step3 = () => ladderStep(2);

  // Step 4: an empty notebook pad. She draws, then taps the green button to check.
  function step4() {
    const L = S.lesson, n = LET[L].n;
    const resume = S.resumeNote ? 'נַמְשִׁיךְ מִכָּאן! ' : ''; S.resumeNote = false;
    S.q = { prompt: `${resume}עַכְשָׁו אַתְּ לְבַד! צַיְּרִי אֶת ${n} בֵּין הַקַּוִּים, וּבַסּוֹף לַחֲצִי עַל הַכַּפְתּוֹר הַיָּרֹק.`, ok: 'וַאוּ! צִיַּרְתְּ בְּעַצְמֵךְ!' };
    $('board').innerHTML = `<div class="draw-wrap"><div class="pad free"><canvas class="free-ink" data-l="${L}" aria-label="ציור חופשי של האות ${n}"></canvas></div></div>`;
    const box = $('options'); box.classList.add('pair');
    box.innerHTML = `<button type="button" class="opt press sponge" style="--c: #FFFFFF; --cd: var(--pink)" aria-label="למחוק">🧽</button>
      <button type="button" class="opt press done-btn" style="--c: var(--go); --cd: var(--go-dk)" aria-label="סיימתי" hidden>
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
    const q = S.q;
    requestAnimationFrame(() => { if (S.q === q) setupFree(L); });
  }
  function setupFree(L) {
    const wrap = $('board').querySelector('.draw-wrap'), pad = wrap.querySelector('.pad'), cv = pad.querySelector('canvas');
    const s = Math.max(200, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight) - 8));
    pad.style.width = s + 'px'; pad.style.height = s + 'px';
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = s * dpr; cv.height = s * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const lines = []; let cur = null;
    const doneBtn = $('options').querySelector('.done-btn'), sponge = $('options').querySelector('.sponge');

    function paint(faded) {
      ctx.clearRect(0, 0, s, s);
      // Notebook guide lines: dashed top line, solid base line.
      ctx.setLineDash([12, 10]); ctx.lineWidth = 3; ctx.strokeStyle = '#6CC4FF';
      ctx.beginPath(); ctx.moveTo(s * 0.06, s * 0.2); ctx.lineTo(s * 0.94, s * 0.2); ctx.stroke();
      ctx.setLineDash([]); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(32,48,71,.3)';
      ctx.beginPath(); ctx.moveTo(s * 0.06, s * 0.8); ctx.lineTo(s * 0.94, s * 0.8); ctx.stroke();
      ctx.globalAlpha = faded ? 0.4 : 1;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = s * 0.07; ctx.strokeStyle = '#2EC4B6';
      lines.forEach((ln) => { ctx.beginPath(); ln.forEach(([x, y], j) => (j ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); if (ln.length === 1) ctx.lineTo(ln[0][0] + 0.1, ln[0][1]); ctx.stroke(); });
      ctx.globalAlpha = 1;
    }
    paint(false);
    const pos = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) * s / r.width, (ev.clientY - r.top) * s / r.height]; };
    cv.addEventListener('pointerdown', (ev) => {
      if (!ev.isPrimary || S.locked) return;
      ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
      cur = [pos(ev)]; lines.push(cur); paint(false);
    });
    cv.addEventListener('pointermove', (ev) => {
      if (!cur || !ev.isPrimary) return;
      const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [];
      (evs.length ? evs : [ev]).forEach((pe) => cur.push(pos(pe)));
      paint(false);
    });
    const up = (ev) => { if (!ev.isPrimary || !cur) return; cur = null; if (lines.length) doneBtn.hidden = false; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    sponge.addEventListener('click', () => { if (S.locked) return; lines.length = 0; doneBtn.hidden = true; paint(false); });

    doneBtn.addEventListener('click', () => {
      if (S.locked || !lines.length) return;
      if (matchesLetter(L, lines, s)) {
        S.locked = true;
        const img = cv.toDataURL('image/png');
        $('board').innerHTML = `<div class="compare"><div class="cmp-card"><img src="${img}" alt="הציור שלה"></div><div class="cmp-card cmp-letter">${L}</div></div>`;
        $('options').innerHTML = '';
        saveLadder(L, 4);
        success(null);
        return;
      }
      S.freeFails = (S.freeFails || 0) + 1;
      S.locked = true; mood('think', 2200);
      paint(true);
      // Show the right letter faintly over her drawing for two seconds, then clear the pad.
      ctx.save(); ctx.globalAlpha = 0.55; ctx.strokeStyle = '#A07BFF'; ctx.lineWidth = s * 0.05; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const k = s * 0.6 / 56;
      STROKES[L].forEach((poly) => { ctx.beginPath(); poly.forEach(([u, v], j) => { const x = s / 2 + (u - 50) * k, y = s * 0.2 + (v - 22) * k; j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); });
      ctx.restore();
      if (S.freeFails >= 2) {
        say('בּוֹאִי נִתְאַמֵּן רֶגַע עִם נְקֻדּוֹת, וְאָז נְנַסֶּה שׁוּב לְבַד!');
        const run = S.run;
        setTimeout(() => { if (S.run !== run) return; S.freeFails = 0; S.i = 2; renderProgress(); ask(); }, 2600);
      } else {
        say('כִּמְעַט! בּוֹאִי נִסְתַּכֵּל יַחַד עַל הָאוֹת, וּנְצַיֵּר שׁוּב.');
        setTimeout(() => { if (!cv.isConnected) return; lines.length = 0; doneBtn.hidden = true; paint(false); S.locked = false; mood('happy'); }, 2400);
      }
    });
  }

  // Compares a free drawing with the letter's strokes, ignoring where and how big it was drawn.
  function matchesLetter(L, lines, s, tune) {
    const T = Object.assign({ cover: 7, prec: 8, minCover: 0.8, minPrec: 0.85, maxDist: 0.45 }, tune);
    const tpl = STROKES[L].map(resample).flat();
    const pts = [];
    lines.forEach((ln) => { for (let j = 0; j < ln.length; j++) { if (j && Math.hypot(ln[j][0] - ln[j - 1][0], ln[j][1] - ln[j - 1][1]) > s * 0.02) { const st = Math.ceil(Math.hypot(ln[j][0] - ln[j - 1][0], ln[j][1] - ln[j - 1][1]) / (s * 0.01)); for (let t = 1; t < st; t++) pts.push([ln[j - 1][0] + (ln[j][0] - ln[j - 1][0]) * t / st, ln[j - 1][1] + (ln[j][1] - ln[j - 1][1]) * t / st]); } pts.push(ln[j]); } });
    const box = (a) => { const xs = a.map((p) => p[0]), ys = a.map((p) => p[1]); return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) }; };
    const tb = box(tpl), ub = box(pts);
    const tW = tb.x1 - tb.x0, tH = tb.y1 - tb.y0, uW = ub.x1 - ub.x0, uH = ub.y1 - ub.y0;
    if (Math.max(uW, uH) < s * 0.15) return false;                    // too small to be a letter
    const thin = tW < 22;                                              // ו and י are narrow
    if (thin ? uW / Math.max(uH, 1) > 0.75 : (uW / Math.max(uH, 1)) / (tW / tH) < 0.45 || (uW / Math.max(uH, 1)) / (tW / tH) > 2.2) return false;
    const sy = tH / Math.max(uH, 1), sx = thin || T.uniform ? sy : tW / Math.max(uW, 1);
    const ucx = (ub.x0 + ub.x1) / 2, tcx = (tb.x0 + tb.x1) / 2;
    const mapped = pts.filter((_, j) => j % 2 === 0).map(([x, y]) => [tcx + (x - ucx) * sx, tb.y0 + (y - ub.y0) * sy]);
    const near = (p, set, tol) => set.some((q) => Math.abs(p[0] - q[0]) < tol && Math.abs(p[1] - q[1]) < tol && Math.hypot(p[0] - q[0], p[1] - q[1]) < tol);
    const covered = tpl.filter((p) => near(p, mapped, T.cover)).length / tpl.length;
    const precise = mapped.filter((p) => near(p, tpl, T.prec)).length / mapped.length;
    if (covered < T.minCover || precise < T.minPrec) return false;
    // Also compare how the ink is spread over a 4x4 grid (catches an open side or a foot in the wrong place).
    const hist = (a) => { const h = Array(16).fill(0); a.forEach(([x, y]) => { const cx2 = thin ? 0 : Math.min(3, Math.max(0, Math.floor((x - tb.x0) / Math.max(tW, 1) * 4))), cy2 = Math.min(3, Math.max(0, Math.floor((y - tb.y0) / Math.max(tH, 1) * 4))); h[cy2 * 4 + cx2]++; }); return h.map((v) => v / a.length); };
    const ht = hist(tpl), hu = hist(mapped);
    const dist = ht.reduce((sum, v, j) => sum + Math.abs(v - hu[j]), 0);
    return dist <= T.maxDist;
  }

  /* ---------------- answers ---------------- */
  function choose(btn, ok, wrongMsg) {
    if (S.locked) return;
    if (ok) return success(btn);
    S.tries++;
    btn.classList.add('wobble');
    setTimeout(() => btn.classList.add('used'), 450);
    mood('think', 1600);
    const right = $('options').querySelector('[data-ok="true"]');
    if (S.tries >= 2 && right) right.classList.add('hint'); // second miss: the answer glows
    say(wrongMsg || TRY);
  }
  function success(btn) {
    S.locked = true;
    $('againBtn').disabled = true;
    if (btn) { btn.classList.remove('hint'); btn.classList.add('right'); }
    mood('party'); chime();
    if (S.q.onWin) S.q.onWin();
    S.i++; renderProgress();
    burst(btn || $('gameBuddy'));
    const name = S.name && Math.random() < 0.4 ? ` ${S.name}` : '';
    const text = `${pick(PRAISE).replace('!', name + '!')} ${S.q.ok}`;
    say(text);
    const run = S.run;
    setTimeout(() => { if (S.run !== run) return; S.i >= S.total ? finish() : ask(); }, talkTime(text));
  }
  function burst(el) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cols = ['var(--sun)', 'var(--pink)', 'var(--go)', 'var(--sky)', 'var(--grape)'];
    for (let k = 0; k < 22; k++) {
      const p = document.createElement('i');
      p.className = 'confetti';
      p.style.left = cx + 'px'; p.style.top = cy + 'px'; p.style.background = cols[k % cols.length];
      document.body.appendChild(p);
      const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
      const an = p.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist + 60}px) rotate(400deg)`, opacity: 0 }], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.4,1)' });
      an.onfinish = () => p.remove();
    }
  }
  function finish() {
    if (S.game === 'lesson') return finishLesson();
    if (S.game === 'task') return finishTask();
    $('endMap').hidden = true; $('endHub').hidden = true;
    show('end'); mood('party');
    $('endStars').innerHTML = Array.from({ length: S.total }, (_, k) => `<span class="on" style="animation-delay:${k * 0.12}s">${STAR}</span>`).join('');
    $('endStars').querySelectorAll('svg').forEach((s, k) => { s.style.animationDelay = k * 0.12 + 's'; s.querySelector('.st').setAttribute('fill', 'var(--sun)'); s.querySelector('.st').setAttribute('stroke', 'var(--sun-dk)'); s.querySelector('.st').classList.remove('st'); });
    const who = S.name ? `, ${S.name}` : '';
    const text = `כָּל הַכָּבוֹד${who}! אָסַפְתְּ ${S.total === 6 ? 'שִׁשָּׁה' : 'שְׁמוֹנָה'} כּוֹכָבִים. אמיליה עֲיֵפָה וְהוֹלֶכֶת לָנוּחַ. נִתְרָאֶה מָחָר!`;
    say(text, $('endBubble'));
    const run = S.run;
    setTimeout(() => { if (S.run === run) mood('sleep'); }, 3200);
  }

  /* ---------------- parents ---------------- */
  const ADULT_WORDS = ['', '', '', 'שלוש', 'ארבע', 'חמש', 'שש', 'שבע', 'שמונה', 'תשע'];
  function openGate() {
    const target = rnd(3, 9);
    $('gateText').textContent = `כדי להיכנס, לחצו על המספר ${ADULT_WORDS[target]}.`;
    const keys = new Set([target]); while (keys.size < 4) keys.add(rnd(1, 9));
    $('gateKeys').innerHTML = shuffle([...keys]).map((k) => `<button type="button" class="press" data-k="${k}">${k}</button>`).join('');
    $('gateKeys').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      if (+b.dataset.k === target) openSettings(); else closeGate();
    }));
    $('gatePanel').hidden = false; $('settingsPanel').hidden = true; $('gate').hidden = false;
  }
  function openSettings() {
    loadVoices();
    $('childName').value = S.name; $('voiceOn').checked = S.voice;
    $('orderRec').checked = S.order === 'rec'; $('orderAbc').checked = S.order !== 'rec';
    $('resetProgress').textContent = `איפוס התקדמות (${getLearned().length} אותיות נלמדו)`;
    $('voiceStatus').textContent = !window.speechSynthesis
      ? 'הדפדפן הזה לא תומך בהקראה. המשחק יעבוד, אבל בלי קול.'
      : heVoice ? `נמצא קול בעברית: ${heVoice.name}.`
      : voicesLoaded ? 'לא נמצא קול בעברית במכשיר. אפשר להוסיף אותו בהגדרות המכשיר (דיבור / הקראת טקסט), או לשחק ב־Chrome או Safari.'
      : 'הקול ייטען בלחיצה הראשונה במשחק.';
    $('gatePanel').hidden = true; $('settingsPanel').hidden = false;
  }
  function closeGate() { $('gate').hidden = true; }

  /* ---------------- events ---------------- */
  document.addEventListener('pointerdown', (e) => { if (e.target.closest('button.press, .choice')) popSound(); });
  document.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => (b.dataset.game === 'letters' ? openMap() : startGame(b.dataset.game))));
  $('homeBtn').addEventListener('click', goHome);
  $('endHome').addEventListener('click', goHome);
  $('mapHome').addEventListener('click', goHome);
  $('endMap').addEventListener('click', () => openMap(S.lesson));
  $('endHub').addEventListener('click', () => openHub(S.lesson));
  $('hubHome').addEventListener('click', goHome);
  $('hubMap').addEventListener('click', () => openMap());
  $('hubBubble').addEventListener('click', () => say($('hubBubble').textContent, $('hubBubble')));
  $('reviewBtn').addEventListener('click', () => startGame('letters'));
  $('mapBubble').addEventListener('click', () => say($('mapBubble').textContent, $('mapBubble')));
  let resizeT = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.screen === 'map') renderMap(); }, 200); });
  let resetArmed = false;
  $('resetProgress').addEventListener('click', () => {
    if (!resetArmed) { resetArmed = true; $('resetProgress').textContent = 'בטוחים? לחצו שוב כדי למחוק'; return; }
    setLearned([]); resetArmed = false; $('resetProgress').textContent = 'ההתקדמות נמחקה';
  });
  $('againBtn').addEventListener('click', () => { if (!S.locked && S.q) say(S.q.prompt); });
  $('bubble').addEventListener('click', () => { if (!S.locked && S.q) say(S.q.prompt); });
  const homeHello = () => { mood('party', 1200); say(S.name ? `שָׁלוֹם ${S.name}! אֲנִי אמיליה. מָה נְשַׂחֵק הַיּוֹם? מִסְפָּרִים אוֹ אוֹתִיּוֹת?` : 'שָׁלוֹם! אֲנִי אמיליה. מָה נְשַׂחֵק הַיּוֹם? מִסְפָּרִים אוֹ אוֹתִיּוֹת?', $('homeBubble')); };
  $('homeBuddy').addEventListener('click', homeHello);
  $('homeBubble').addEventListener('click', homeHello);
  $('parentBtn').addEventListener('click', openGate);
  $('gateClose').addEventListener('click', closeGate);
  $('settingsClose').addEventListener('click', () => {
    S.name = $('childName').value.trim(); S.voice = $('voiceOn').checked;
    S.order = $('orderRec').checked ? 'rec' : 'abc';
    try { localStorage.setItem('amelia.name', S.name); localStorage.setItem('amelia.voice', S.voice ? 'on' : 'off'); localStorage.setItem('amelia.order', S.order); } catch (e) {}
    closeGate();
    if (S.screen === 'map') openMap();
    if (S.screen === 'home') $('homeBubble').textContent = S.name ? `שָׁלוֹם ${S.name}! אֲנִי אמיליה. מָה נְשַׂחֵק הַיּוֹם?` : 'שָׁלוֹם! אֲנִי אמיליה. מָה נְשַׂחֵק הַיּוֹם?';
  });

  if (S.name) $('homeBubble').textContent = `שָׁלוֹם ${S.name}! אֲנִי אמיליה. מָה נְשַׂחֵק הַיּוֹם?`;
  try { const wl = navigator.wakeLock; if (wl) wl.request('screen').catch(() => {}); } catch (e) {}
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
</body>
</html>
